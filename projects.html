<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PAO | Projects</title>
  <meta name="description" content="All projects by Paolo Andrei A. Enerio — backend systems, machine learning tools, and full stack applications." />
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/projects.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <nav class="nav" aria-label="Primary">
      <span class="nav__brand"><span class="accent">&lt;Paolo</span> Andrei/&gt;</span>
      <button class="nav__toggle" aria-label="Toggle navigation" aria-expanded="false">
        <img src="assets/icons/ui/nav-toggle.svg" alt="" width="20" height="20" />
      </button>
      <div class="nav__tabs">
        <a class="nav__tab" href="index.html">Home</a>
        <a class="nav__tab" href="projects.html" aria-current="page">Projects</a>
        <a class="nav__tab" href="practicum.html">Practicum</a>
      </div>
    </nav>
  </header>

  <main id="main">
    <section class="section projects-page-section" aria-label="Projects">
      <div class="container">
        <div class="section-label">
          <h1 class="section-label__title">My Projects</h1>
        </div>
        <div class="projects-grid" id="projects-grid"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> Paolo Andrei Enerio</p>
  </footer>

  <script type="module">
    import { initNavigation } from "./js/navigation.js";
    import { initProjects } from "./js/projects.js";
    import { initScrollReveal } from "./js/scroll-reveal.js";

    document.addEventListener("DOMContentLoaded", () => {
      initNavigation();
      initProjects();
      initScrollReveal();
      const yearEl = document.getElementById("year");
      if (yearEl) yearEl.textContent = String(new Date().getFullYear());
    });
  </script>
