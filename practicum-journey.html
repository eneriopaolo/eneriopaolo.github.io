<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PAO - Practicum Journey</title>
  <meta name="description" content="A detailed, slide-by-slide walkthrough of Paolo Andrei's practicum experience at The Medical City South Luzon." />
  <link rel="icon type="image/x-icon" href="assets/icons/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/practicum-journey.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <nav class="nav" aria-label="Primary">
      <span class="nav__brand"><span class="accent">&lt;Paolo</span> Andrei/&gt;</span>
      <button class="nav__toggle" aria-label="Toggle navigation" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      </button>
      <div class="nav__tabs">
        <a class="nav__tab" href="index.html">Home</a>
        <a class="nav__tab" href="practicum.html" aria-current="page">Practicum</a>
      </div>
    </nav>
  </header>

  <main id="main">
    <section class="section practicum-journey-section" aria-label="Practicum experience, in detail">
      <div class="container">
        <a class="back-link" href="practicum.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
          Back to Practicum
        </a>

        <div class="section-label">
          <h1 class="section-label__title">My Practicum Journey</h1>
        </div>

        <div class="slide-deck" id="practicum-slideshow"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> Paolo Andrei Enerio</p>
  </footer>

  <script type="module">
    import { initNavigation } from "./js/navigation.js";
    import { initPracticumSlideshow } from "./js/practicum-slides.js";
    import { initScrollReveal } from "./js/scroll-reveal.js";

    document.addEventListener("DOMContentLoaded", () => {
      initNavigation();
      initPracticumSlideshow();
      initScrollReveal();
      const yearEl = document.getElementById("year");
      if (yearEl) yearEl.textContent = String(new Date().getFullYear());
    });
  </script>
</body>
</html>
